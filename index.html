<!DOCTYPE html>
<html>
<head>
<title>Dungeon Ascension</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#1a1a1a;
}

#player{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#00ff66;
    position:absolute;
    left:100px;
    top:100px;
    box-shadow:0 0 20px #00ff66;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

const player = document.getElementById("player");

let x = 100;
let y = 100;

const speed = 5;

const keys = {};

document.addEventListener("keydown", (e)=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", (e)=>{
    keys[e.key.toLowerCase()] = false;
});

function gameLoop(){

    let dx = 0;
    let dy = 0;

    if(keys["w"]) dy -= 1;
    if(keys["s"]) dy += 1;
    if(keys["a"]) dx -= 1;
    if(keys["d"]) dx += 1;

    if(dx !== 0 || dy !== 0){

        const length = Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;

        x += dx * speed;
        y += dy * speed;
    }

    player.style.left = x + "px";
    player.style.top = y + "px";

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
