<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dungeon Ascension</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    background-image:
        linear-gradient(#222 1px, transparent 1px),
        linear-gradient(90deg, #222 1px, transparent 1px);
    background-size:50px 50px;
}

#player{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#00ff66;
    position:absolute;
    left:100px;
    top:100px;
    box-shadow:0 0 20px #00ff66;
}

#stats{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:10px;
    font-family:Arial, sans-serif;
}
</style>
</head>

<body>

<div id="stats">
Level: 1<br>
XP: 0<br>
Gold: 0
</div>

<div id="player"></div>

<script>

const player = document.getElementById("player");

let x = 100;
let y = 100;

const speed = 5;

const keys = {};

document.addEventListener("keydown",(e)=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",(e)=>{
    keys[e.key.toLowerCase()] = false;
});

function gameLoop(){

    let dx = 0;
    let dy = 0;

    if(keys["w"]) dy--;
    if(keys["s"]) dy++;
    if(keys["a"]) dx--;
    if(keys["d"]) dx++;

    if(dx !== 0 || dy !== 0){

        const len = Math.sqrt(dx*dx + dy*dy);

        dx /= len;
        dy /= len;

        x += dx * speed;
        y += dy * speed;
    }

    player.style.left = x + "px";
    player.style.top = y + "px";

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
