<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bryan's Basement</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

#world{
    width:3000px;
    height:3000px;
    position:absolute;
    background-image:
    linear-gradient(#222 1px, transparent 1px),
    linear-gradient(90deg,#222 1px,transparent 1px);
    background-size:50px 50px;
}

#ui{
    position:fixed;
    top:10px;
    left:10px;
    z-index:999;
    background:#000c;
    padding:10px;
    border-radius:10px;
}

.player{
    width:32px;
    height:32px;
    border-radius:50%;
    position:absolute;
}

.playerName{
    position:absolute;
    top:-18px;
    width:80px;
    left:-24px;
    text-align:center;
    font-size:12px;
    color:white;
}
</style>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.jsscript"/script>

</head>

<body>

<div id="ui">
    <div id="count">Players Online: 0</div>

    <br>

    <input id="nameBox" value="Player">

    <br><br>

    <input
        id="colorBox"
        type="color"
        value="#00ff66">
</div>

<div id="world"></div>

<script src="game.js"></script>

</body>
</html>
